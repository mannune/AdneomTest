# Configuration de déploiement Netlify.
# L'app est statique : aucune commande de compilation.
[build]
  command = ""
  publish = "batchcooking"

# Le service worker doit toujours être vérifié auprès du serveur,
# sinon les mises à jour de l'app peuvent rester bloquées dans le cache.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# Le manifeste doit être servi avec le bon type pour l'installation.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
